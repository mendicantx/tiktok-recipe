# Apache vhost for the Recipe Box. Install on mendicant.com:
#   sudo certbot certonly --apache -d recipes.mendicant.com     # cert first; the 443 block needs it
#   sudo cp apache-recipes.mendicant.com.conf /etc/apache2/sites-available/tiktok-recipe.conf
#   sudo a2ensite tiktok-recipe && sudo apache2ctl configtest && sudo systemctl reload apache2
# Mirrors ffrk-ability-parser.conf.

<VirtualHost *:80>
    ServerName recipes.mendicant.com
    Redirect permanent / https://recipes.mendicant.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName recipes.mendicant.com
    SSLEngine on

    PassengerRuby /home/jason/.asdf/shims/ruby
    PassengerAppEnv production

    DocumentRoot /data/www/tiktok-recipe/current/public
    <Directory /data/www/tiktok-recipe/current/public>
        Allow from all
        Options -MultiViews
        Require all granted
    </Directory>

    # Cover photo uploads from the convert-recipe skill
    LimitRequestBody 20971520

    ErrorLog ${APACHE_LOG_DIR}/tiktok-recipe-error.log
    CustomLog ${APACHE_LOG_DIR}/tiktok-recipe-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/recipes.mendicant.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/recipes.mendicant.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
